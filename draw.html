<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과학 그림판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#16202E;--muted:#5E6878;--line:#DDE2E9;--accent:#3E8E2F;--accent-s:#EAF5E6;--paper:#FBFCFD}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.01em}
header{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0 8px 0 0;font-weight:800}
button,select,input{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.82rem;font-weight:600;color:var(--ink);cursor:pointer}
.btn:hover{background:#f6f7f9}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{background:#357a28}
.btn.magic{border-color:#7C5CC4;color:#4B3391;background:#F4F0FC}.btn.magic:hover{background:#ECE5FA}
.btn svg,.tool svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:52px minmax(250px,300px) minmax(0,1fr) minmax(280px,330px);gap:10px;padding:10px;height:calc(100vh - 56px)}
.tools{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px}
.tool{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}
.tool:hover{background:#f6f7f9}.tool.on{background:var(--accent-s);border-color:var(--accent);color:var(--ink)}
/* 모형 선택창 (왼쪽) */
.pick{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pick-head{padding:10px 10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ff{display:flex;gap:5px}.ff input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.8rem}.ff .btn{padding:6px 10px}
#fmsg{color:#B42318}
.pick-head h2,.pv h2{font-size:.9rem;margin:0;font-weight:800}
.cats{display:flex;flex-wrap:wrap;gap:4px}
.cats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:.76rem;font-weight:600;color:var(--muted);cursor:pointer}
.cats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
#q{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.8rem;width:100%}
.grid{flex:1;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;align-content:start}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 7px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:.74rem;font-weight:700;color:var(--ink);cursor:pointer}
.card:hover{border-color:var(--accent)}.card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-s) inset;background:#F6FBF3}
.card svg{width:100%;height:74px}
.card .n{position:absolute;top:4px;right:5px;font-size:.62rem;font-weight:700;color:#4B3391;background:#F1ECFB;border-radius:6px;padding:0 5px}
.style{border-top:1px solid var(--line);padding:8px 10px;font-size:.8rem}
.style summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.78rem}
.style .in{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem}
.row label{color:var(--muted);font-weight:600}
.sw{width:21px;height:21px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
/* 캔버스 */
.stage{position:relative;overflow:auto;background:#E3E7EC;border-radius:12px;border:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center;padding:18px;min-height:0}
#cv{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);touch-action:none;user-select:none;flex:none}
#cv .obj{cursor:move}
#txt{position:absolute;display:none;border:2px solid var(--accent);border-radius:6px;padding:4px 6px;font-size:16px;min-width:160px;background:#fff;z-index:5}
/* 미리보기창 (오른쪽) */
.pv{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pv-tabs{display:flex;border-bottom:1px solid var(--line)}
.pv-tabs button{flex:1;border:0;background:none;padding:10px 6px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.pv-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pv-tabs .x{flex:none;width:40px;display:none}
.pv-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.pv-body[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:.76rem;font-weight:600;color:var(--ink);cursor:pointer}
.chips button.on{border-color:#7C5CC4;background:#F1ECFB;color:#3B2780}
.chips button:hover{border-color:#7C5CC4}
.pvbox{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px;display:flex;align-items:center;justify-content:center;min-height:200px}
.pvbox svg{width:100%;height:auto;max-height:380px}
.empty{color:var(--muted);font-size:.82rem;line-height:1.6;text-align:center;padding:24px 8px}
.chk{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{flex:1;justify-content:center}
.hint{font-size:.72rem;color:var(--muted);line-height:1.55;margin:0}
.sub{font-size:.72rem;font-weight:700;color:var(--muted);margin:2px 0 -4px}
#meas{position:absolute;width:0;height:0;visibility:hidden}
@media (max-width:1180px){
  .wrap{grid-template-columns:52px minmax(230px,280px) minmax(0,1fr)}
  .pv{position:fixed;right:12px;top:66px;bottom:12px;width:min(340px,calc(100vw - 24px));z-index:30;box-shadow:0 10px 30px rgba(22,32,46,.18);display:none}
  .pv.open{display:flex}.pv-tabs .x{display:block}
}
@media (max-width:760px){
  .wrap{grid-template-columns:44% minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 100px)}
  .tools{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .grid{grid-template-columns:1fr}
  .stage{padding:8px}
  header .lbl{display:none}
}
/* ===== 2026-11 정리: 제도판처럼 — 판은 붙이고 가는 선으로만 나눔, 캔버스 바닥만 모눈 ===== */
:root{--bg:#F4F6F8;--ink:#172030;--muted:#5B6576;--line:#E1E5EB;--soft:#F0F2F5}
header{gap:2px;padding:6px 12px;min-height:52px}
header h1{display:flex;align-items:center;gap:9px;font-size:1rem;margin-right:14px;letter-spacing:-.03em}
header h1::before{content:'';width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;background:linear-gradient(var(--accent),var(--accent)) 50%/8px 2px no-repeat,linear-gradient(var(--accent),var(--accent)) 50%/2px 8px no-repeat}
header>.btn{border-color:transparent;background:transparent;padding:7px 9px;color:var(--muted)}
header>.btn:hover{background:var(--soft);color:var(--ink)}
header>.btn:nth-of-type(4),header>.btn:nth-of-type(6){margin-right:6px;position:relative}
header>.btn:nth-of-type(4)::after,header>.btn:nth-of-type(6)::after{content:'';position:absolute;right:-5px;top:8px;bottom:8px;width:1px;background:var(--line)}
header>.btn.magic{border-color:transparent;background:#F4F0FC;color:#4B3391}
header>.btn.magic:hover{background:#ECE5FA}
header>.btn.pri{background:var(--accent);color:#fff;margin-left:4px}
header>.btn.pri:hover{background:#357a28;color:#fff}
header>label.btn{color:var(--muted)}
.wrap{gap:0;padding:0;height:calc(100vh - 52px);background:#fff}
.tools,.pick,.pv{border:0;border-radius:0}
.tools{border-right:1px solid var(--line);padding:8px 6px;gap:4px;align-items:center}
.tool{width:38px;height:38px;border-radius:8px}
.tool.on{border-color:transparent;background:var(--ink);color:#fff}
.pick{border-right:1px solid var(--line)}
.pv{border-left:1px solid var(--line)}
.pick-head{padding:14px 12px 10px;gap:10px}
.pick-head h2,.pv h2{font-size:.95rem;letter-spacing:-.02em}
.cats{gap:4px}
.cats button{border:0;background:var(--soft);border-radius:999px;padding:5px 11px}
.cats button:hover{color:var(--ink)}
.cats button.on{background:var(--ink);color:#fff}
#q,.ff input{background:var(--soft);border-color:transparent}
#q:focus,.ff input:focus{outline:none;background:#fff;border-color:var(--accent)}
.grid{gap:6px;padding:10px 12px}
.card{border-color:transparent;background:var(--soft);border-radius:10px;padding:8px 4px 9px;font-weight:600}
.card:hover{border-color:var(--line);background:#fff}
.card.on{border-color:var(--accent);background:#fff;box-shadow:none}
.style{padding:10px 12px}
.stage{border:0;border-radius:0;padding:28px;background-color:#ECEFF3;background-image:radial-gradient(#C9D0DA 1px,transparent 1px);background-size:16px 16px}
#cv{box-shadow:0 0 0 1px #D5DBE3,0 6px 20px rgba(23,32,48,.07)}
.pv-tabs button{padding:13px 6px}
.pv-body{padding:14px}
.pvbox{border-color:var(--line);background-color:#fff;background-image:radial-gradient(#E3E7EC 1px,transparent 1px);background-size:12px 12px}
.chips button{border-radius:999px}
@media (max-width:1180px){.pv{border:1px solid var(--line);border-radius:12px;top:60px}}
@media (max-width:760px){.wrap{height:calc(100vh - 96px)}.tools{border-right:0;border-bottom:1px solid var(--line);flex-direction:row}header>.btn:nth-of-type(4)::after,header>.btn:nth-of-type(6)::after{display:none}}
</style>
</head>
<body>
<header>
  <h1>과학 그림판</h1>
  <button class="btn" onclick="undo()" title="되돌리기 (Ctrl+Z)"><i data-lucide="undo-2"></i><span class="lbl">되돌리기</span></button>
  <button class="btn" onclick="redo()" title="다시 하기 (Ctrl+Y)"><i data-lucide="redo-2"></i></button>
  <button class="btn" onclick="delSel()" title="선택 지우기 (Delete)"><i data-lucide="trash-2"></i><span class="lbl">지우기</span></button>
  <button class="btn" onclick="dupSel()" title="복제 (Ctrl+D)"><i data-lucide="copy"></i></button>
  <button class="btn" onclick="order(1)" title="맨 앞으로"><i data-lucide="bring-to-front"></i></button>
  <button class="btn" onclick="order(-1)" title="맨 뒤로"><i data-lucide="send-to-back"></i></button>
  <button class="btn" onclick="rot(-15)" title="왼쪽으로 15° 돌리기"><i data-lucide="rotate-ccw"></i></button>
  <button class="btn" onclick="rot(15)" title="오른쪽으로 15° 돌리기"><i data-lucide="rotate-cw"></i></button>
  <button class="btn" onclick="flip()" title="좌우 뒤집기"><i data-lucide="flip-horizontal-2"></i></button>
  <span style="flex:1"></span>
  <button class="btn magic" onclick="pvShow('conv')" title="펜으로 그린 그림을 교재 그림으로 바꾸기"><i data-lucide="wand-sparkles"></i>교재 그림으로 바꾸기</button>
  <label class="btn" title="따라 그릴 그림을 바탕에 깔기"><i data-lucide="image"></i><span class="lbl">바탕 그림</span><input type="file" accept="image/*" hidden onchange="bgLoad(this)"></label>
  <button class="btn" onclick="clearAll()"><i data-lucide="file-plus"></i><span class="lbl">새 그림</span></button>
  <button class="btn" onclick="saveSVG()"><i data-lucide="file-code"></i>SVG</button>
  <button class="btn pri" onclick="savePNG()"><i data-lucide="download"></i>PNG 저장</button>
</header>
<div class="wrap">
  <div class="tools" id="tools">
    <button class="tool on" data-t="sel" title="선택·이동 (V)"><i data-lucide="mouse-pointer-2"></i></button>
    <button class="tool" data-t="pen" title="펜 (P)"><i data-lucide="pencil"></i></button>
    <button class="tool" data-t="line" title="직선 (L) — Shift: 수평·수직·45°"><i data-lucide="minus"></i></button>
    <button class="tool" data-t="arrow" title="화살표 (A)"><i data-lucide="move-right"></i></button>
    <button class="tool" data-t="rect" title="사각형 (R)"><i data-lucide="square"></i></button>
    <button class="tool" data-t="ellipse" title="원·타원 (O) — Shift: 정원"><i data-lucide="circle"></i></button>
    <button class="tool" data-t="text" title="글자 (T) — H_2O, x^2, 10^{-3}"><i data-lucide="type"></i></button>
  </div>

  <aside class="pick" aria-label="모형 선택">
    <div class="pick-head">
      <h2>모형 고르기</h2>
      <div class="cats" id="cats"></div>
      <input id="q" type="search" placeholder="모형 찾기 (예: 세포, 화산, 전선)">
      <form id="ff" class="ff"><input id="fq" placeholder="화학식으로 그리기: H2O, CH4, NaCl, Na, Cl-" autocomplete="off" aria-label="화학식"><button class="btn pri" type="submit">그리기</button></form>
      <p class="hint" id="fmsg" hidden></p>
    </div>
    <div class="grid" id="grid"></div>
    <details class="style">
      <summary>선·채우기·캔버스</summary>
      <div class="in">
        <div><div class="sub">선 색</div><div class="row" id="strokes" style="margin-top:8px"></div></div>
        <div><div class="sub">채우기</div><div class="row" id="fills" style="margin-top:8px"></div></div>
        <div class="row"><label for="sw">굵기</label><input type="range" id="sw" min="1" max="10" value="2" style="flex:1"><span id="swv">2</span></div>
        <div class="row"><label for="dash">점선</label><input type="checkbox" id="dash"><label for="fs" style="margin-left:8px">글자 크기</label><input type="number" id="fs" value="18" min="8" max="72" style="width:58px"></div>
        <div class="row"><label for="size">캔버스</label><select id="size" onchange="setSize(this.value)"><option value="800x500">가로 800×500</option><option value="600x600">정사각 600×600</option><option value="500x700">세로 500×700</option><option value="1000x400">넓게 1000×400</option></select></div>
      </div>
    </details>
  </aside>

  <div class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
      <g id="bg"></g><g id="layer"></g><g id="ui"></g>
    </svg>
    <input id="txt" type="text" placeholder="글자 입력 후 Enter">
  </div>

  <aside class="pv" id="pv" aria-label="미리보기">
    <div class="pv-tabs">
      <button data-m="model" class="on">모형 미리보기</button>
      <button data-m="conv">펜 그림 바꾸기</button>
      <button class="x" onclick="pvClose()" title="닫기" aria-label="미리보기 닫기">✕</button>
    </div>
    <div class="pv-body" id="pv-model">
      <div class="empty" id="pvEmpty">왼쪽에서 모형을 고르면 여기에서 크게 보고,<br>세부 모습을 바꾼 뒤 그림에 넣을 수 있습니다.</div>
      <div id="pvMain" hidden style="display:flex;flex-direction:column;gap:10px">
        <h2 id="pvTitle"></h2>
        <div class="sub">세부 모습</div>
        <div class="chips" id="vars"></div>
        <div class="pvbox"><svg id="pvsvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <label class="chk"><input type="checkbox" id="lab" checked> 이름표 보이기</label>
        <div class="acts">
          <button class="btn pri" id="ins"><i data-lucide="plus"></i>그림에 넣기</button>
          <button class="btn" id="rep" disabled><i data-lucide="replace"></i>선택한 모형 바꾸기</button>
        </div>
        <p class="hint" id="pvHint">캔버스에서 넣은 모형을 선택한 뒤 위의 세부 모습을 누르면 그 자리에서 바로 바뀝니다.</p>
      </div>
    </div>
    <div class="pv-body" id="pv-conv" hidden>
      <p class="hint">펜으로 그린 선을 매끄럽게 다듬고, 무엇을 그렸는지에 맞춰 색과 이름표를 넣습니다. 캔버스의 펜 선 전체를 바꿉니다.</p>
      <div class="sub">무엇을 그렸나요?</div>
      <div class="chips" id="subs"></div>
      <label class="chk"><input type="checkbox" id="cLab" checked> 이름표 달기</label>
      <label class="chk"><input type="checkbox" id="cSnap" checked> 거의 동그란 선은 원으로, 거의 곧은 선은 직선으로</label>
      <label class="chk"><input type="checkbox" id="cFill" checked> 빠진 구조 채우기 (세포라면 교과서처럼 소기관을 갖춤)</label>
      <label class="chk"><input type="checkbox" id="cModel"> 내 선 대신 정교한 모형으로 바꾸기</label>
      <div class="pvbox"><svg id="cvsvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="acts"><button class="btn pri" id="cGo"><i data-lucide="wand-sparkles"></i>이렇게 바꾸기</button></div>
      <p class="hint" id="cInfo"></p>
    </div>
  </aside>
</div>
<svg id="meas" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const cv = $('cv'), layer = $('layer'), ui = $('ui'), bg = $('bg');
const ST = {tool: 'sel', stroke: '#16202E', fill: 'none', sel: null, cat: '생명', pick: null, vi: 0, pvMode: 'model', subj: '자동'};
const STROKES = ['#16202E', '#6B7280', '#DC2626', '#2563EB', '#16A34A', '#D97706', '#7C3AED', '#FFFFFF'];
const FILLS = ['none', '#FFFFFF', '#E5E7EB', '#9CA3AF', '#DBEAFE', '#FEE2E2', '#DCFCE7', '#FEF3C7', '#16202E'];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const f1 = n => Math.round(n * 10) / 10;

/* ================= 그리기 도우미 ================= */
let _s = 1; const seed = n => { _s = n; }; const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;
const T = (x, y, t, o = '') => `<text x="${f1(x)}" y="${f1(y)}" stroke="none" fill="#1F2937" font-size="11" font-weight="500" ${o}>${t}</text>`;
const tube = (d, c1, c2, w) => `<path d="${d}" fill="none" stroke="${c1}" stroke-width="${w}"/><path d="${d}" fill="none" stroke="${c2}" stroke-width="${f1(w - 2.6)}"/>`;
const dots = (a, r = 1.6, c = '#334155') => a.map(([x, y]) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="${c}" stroke="none"/>`).join('');
const ball = (x, y, r, c, s, t = '', tc = '#fff') => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="${c}" stroke="${s}" stroke-width="1.2"/>${t ? `<text x="${f1(x)}" y="${f1(y + r * .36)}" font-size="${f1(r * .95)}" font-weight="700" text-anchor="middle" fill="${tc}" stroke="none">${t}</text>` : ''}`;
const head = (x, y, a, c, h = 7) => `<path d="M${f1(x)} ${f1(y)} L${f1(x - h * Math.cos(a - .45))} ${f1(y - h * Math.sin(a - .45))} L${f1(x - h * Math.cos(a + .45))} ${f1(y - h * Math.sin(a + .45))} Z" fill="${c}" stroke="none"/>`;
const arw = (x1, y1, x2, y2, c = '#1D4ED8', w = 2, h = 7) => `<path d="M${f1(x1)} ${f1(y1)} L${f1(x2)} ${f1(y2)}" stroke="${c}" stroke-width="${w}" fill="none"/>` + head(x2, y2, Math.atan2(y2 - y1, x2 - x1), c, h);

          if (pts.every(p => inside(p, out.poly) && bdist(p, out.poly) > erW * 1.6 && !taken.some(q => q.r > 3 && Math.hypot(q.c[0] - p[0], q.c[1] - p[1]) < q.r + erW * .8))) { ER += tube(bez(pts, false), '#5B8FD0', '#D6E6F8', erW); pts.forEach(p => put(p, erW)); lab(pts[6], '소포체'); } }); }
      if (!plant) { const g = find(R * .15); if (g) { const th = hasNuc ? Math.atan2(hasNuc.c[1] - g.c[1], hasNuc.c[0] - g.c[0]) * 180 / Math.PI + 90 : 0; ORG += golgiAt(g.c[0], g.c[1], th, R * .11); lab(g.c, '골지체'); } }
      if (plant) for (let tries = 0; nChl < 6 && tries < 6; tries++) { const it = find(R * .12, 'wall'); if (!it) break; const q = nearPt(it.c, out.poly); ORG += chloroAt(it.c[0], it.c[1], Math.atan2(q[1] - it.c[1], q[0] - it.c[0]) * 180 / Math.PI + 90, R * .11, R * .055); nChl++; lab(it.c, '엽록체'); }
      seed(13); for (let tries = 0; nMito < (plant ? 2 : 3) && tries < 4; tries++) { const it = find(plant ? R * .1 : R * .17); if (!it) break; ORG += mitoAt(it.c[0], it.c[1], rnd() * 180, it.r * .95, it.r * .42); nMito++; lab(it.c, '마이토콘드리아'); }
      if (!plant) { for (let tries = 0; nLyso < 2 && tries < 3; tries++) { const it = find(R * .055); if (!it) break; ORG += lysoAt(it.c[0], it.c[1], R * .045); nLyso++; lab(it.c, '라이소좀'); } const ce = find(R * .07); if (ce) { ORG += centAt(ce.c[0], ce.c[1], R / 110); lab(ce.c, '중심체'); } }
      let nr = dotsA.length; for (let tries = 0; nr < 18 && tries < 30; tries++) { const it = find(R * .012); if (!it) break; DOT += rib(it.c); nr++; lab(it.c, '라이보솜'); }
    }
    const cyt = spotFinder(out, taken)(R * .03); if (cyt) lab(cyt.c, '세포질');
    s += ER + ORG + DOT;
    generic(A.filter(o => o !== out && !inn(o) && !(o.dot && inside(o.c, out.poly))));
  } else if (S === '지구 내부' && loops.length) {
    const ring = loops.slice(0, 4), cx = ring.reduce((a, o) => a + o.c[0], 0) / ring.length, cy = ring.reduce((a, o) => a + o.c[1], 0) / ring.length, rs = ring.map(o => Math.sqrt(o.area / Math.PI));
    const nm = ring.length >= 4 ? ['지각', '맨틀', '외핵', '내핵'] : ring.length === 3 ? ['맨틀', '외핵', '내핵'] : ['맨틀', '핵'], col = {지각: '#8D6E63', 맨틀: '#E07A4F', 외핵: '#F2A93B', 내핵: '#FBE27A', 핵: '#F2A93B'};
    if (ring.length < 4) { s += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(rs[0] + 4)}" fill="#8D6E63" stroke="#5D4037" stroke-width="1.2"/>`; lab([cx - (rs[0] + 2) * .707, cy - (rs[0] + 2) * .707], '지각'); }
    ring.forEach((o, i) => { s += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(rs[i])}" fill="${col[nm[i]]}" stroke="#7A4A2A" stroke-width="1"/>`; const r2 = i + 1 < rs.length ? (rs[i] + rs[i + 1]) / 2 : rs[i] * .45; lab([cx + r2 * .707, cy - r2 * .707], nm[i]); });
    generic(A.filter(o => !ring.includes(o)));
  } else if (S === '원자' && loops.length) {
    const core = loops[loops.length - 1], orbits = loops.slice(0, -1), [cx, cy] = core.c, cr = Math.max(9, Math.sqrt(core.area / Math.PI)), ors = orbits.map(o => Math.sqrt(o.area / Math.PI));
    ors.forEach(r => s += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="none" stroke="#9AA5B1" stroke-width="1.3"/>`); if (ors.length) lab([cx - ors[0] * .707, cy - ors[0] * .707], '전자 껍질');
    const ne = Math.max(1, dotsA.length), m = Math.min(30, ne * 2), rb = Math.max(2.5, cr * .95 / Math.sqrt(m) * .95);
    for (let i = m - 1; i >= 0; i--) { const rr = Math.max(0, cr - rb) * Math.sqrt((i + .5) / m), th = i * 2.39996; s += ball(cx + rr * Math.cos(th), cy + rr * Math.sin(th), f1(rb), i % 2 ? '#9CA3AF' : '#E04848', i % 2 ? '#6B7280' : '#A33A3A'); }
    lab([cx, cy], '원자핵');
    dotsA.forEach(o => { const d = Math.hypot(o.c[0] - cx, o.c[1] - cy), th = Math.atan2(o.c[1] - cy, o.c[0] - cx), r = ors.length ? ors.reduce((b, r) => Math.abs(r - d) < Math.abs(b - d) ? r : b, ors[0]) : d, x = cx + r * Math.cos(th), y = cy + r * Math.sin(th); s += ball(x, y, f1(Math.max(5, cr * .3)), '#4C7FD9', '#2B5BB0', '−'); lab([x, y], '전자'); });
    generic(opens);
  } else generic(A);
  if (labels && L.length) s += labelsSVG(L, bb.x, bb.y, bb.w, bb.h);
  return {S, auto, n: strokes.length, svg: uniq(polish(WRAP(s)))};
}
$('subs').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.subj = b.dataset.s; convPreview(); };
['cLab', 'cSnap', 'cModel', 'cFill'].forEach(id => $(id).onchange = convPreview);
function convPreview() {
  const r = convert(ST.subj, $('cSnap').checked, $('cLab').checked, $('cModel').checked);
  $('subs').innerHTML = SUBJ.map(x => `<button type="button" data-s="${x}" class="${x === ST.subj ? 'on' : ''}">${x === '자동' && r ? `자동 (${r.auto})` : x}</button>`).join('');
  $('cModel').parentElement.style.opacity = r && SUBJ_MODEL[r.S] ? 1 : .45; $('cModel').disabled = !(r && SUBJ_MODEL[r.S]);
  if (!r) { $('cvsvg').innerHTML = ''; $('cvsvg').setAttribute('viewBox', '0 0 10 10'); $('cInfo').textContent = '캔버스에 펜으로 먼저 그려 주세요. 예: 큰 테두리 안에 핵(둥근 선), 마이토콘드리아(길쭉한 선), 소포체(열린 선), 라이보솜(점)을 그리면 동물 세포로 알아봅니다.'; $('cGo').disabled = true; return; }
  $('cGo').disabled = false; fitView($('cvsvg'), r.svg);
  $('cInfo').textContent = `펜 선 ${r.n}개를 '${r.S}'(으)로 바꿉니다.` + (ST.subj === '자동' ? ' 다르게 알아봤다면 위에서 직접 고르세요.' : '') + ' 바꾼 뒤에도 되돌리기(Ctrl+Z)로 원래 선을 살릴 수 있습니다.';
}
$('cGo').onclick = () => {
  const r = convert(ST.subj, $('cSnap').checked, $('cLab').checked, $('cModel').checked); if (!r) return;
  penStrokes().forEach(s => s.g.remove());
  const g = makeObj(r.svg, 'stamp', 0, 0, {}); g.dataset.name = r.S; place(g); setTool('sel'); select(g); commit(); convPreview(); pvCloseNarrow();
};

/* ================= 바탕 그림 ================= */
function bgLoad(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const W = +cv.getAttribute('width'), H = +cv.getAttribute('height'), k = Math.min(W / im.width, H / im.height);
    bg.innerHTML = `<image href="${r.result}" x="${(W - im.width * k) / 2}" y="${(H - im.height * k) / 2}" width="${im.width * k}" height="${im.height * k}" opacity=".35"/>`; commit();
    if (confirm('바탕 그림을 깔았습니다. 그림을 따라 그린 뒤 저장할 때 바탕 그림도 넣을까요?\n(확인: 넣기 · 취소: 따라 그리기용으로만 쓰고 저장할 땐 뺌)')) bg.dataset.keep = '1'; else delete bg.dataset.keep;
  }; im.src = r.result; }; r.readAsDataURL(f);
}

/* ================= 되돌리기·자동 저장 ================= */
const HK = 'sciDrawV1'; let hist = [], hi = -1;
const snap = () => JSON.stringify({w: cv.getAttribute('width'), h: cv.getAttribute('height'), layer: layer.innerHTML, bg: bg.innerHTML, keep: bg.dataset.keep || ''});
function restore(s) { const d = JSON.parse(s); cv.setAttribute('width', d.w); cv.setAttribute('height', d.h); cv.setAttribute('viewBox', `0 0 ${d.w} ${d.h}`); layer.innerHTML = d.layer; bg.innerHTML = d.bg || ''; if (d.keep) bg.dataset.keep = '1'; else delete bg.dataset.keep; $('size').value = d.w + 'x' + d.h; select(null); }
function commit() { const s = snap(); if (hist[hi] === s) return; hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 80) hist.shift(); hi = hist.length - 1; try { localStorage.setItem(HK, s); } catch (e) {} if (ST.pvMode === 'conv' && !$('pv-conv').hidden) convPreview(); }
function undo() { if (hi > 0) { hi--; restore(hist[hi]); try { localStorage.setItem(HK, hist[hi]); } catch (e) {} } }
function redo() { if (hi < hist.length - 1) { hi++; restore(hist[hi]); try { localStorage.setItem(HK, hist[hi]); } catch (e) {} } }
function clearAll() { if (layer.children.length && !confirm('지금 그림을 지우고 새로 시작할까요? (되돌리기로 살릴 수 있습니다)')) return; layer.innerHTML = ''; bg.innerHTML = ''; select(null); commit(); }

/* ================= 저장 ================= */
function exportSVG() {
  const c = cv.cloneNode(true); c.querySelector('#ui').remove();
  if (!bg.dataset.keep) c.querySelector('#bg').remove(); else c.querySelectorAll('#bg image').forEach(i => i.setAttribute('opacity', '1'));
  c.querySelectorAll('.obj').forEach(g => { g.removeAttribute('class'); for (const k of Object.keys(g.dataset)) delete g.dataset[k]; });
  c.insertAdjacentHTML('afterbegin', `<rect width="100%" height="100%" fill="#fff"/>`); c.removeAttribute('style'); c.removeAttribute('id');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(c);
}
const fname = ext => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `과학그림_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.${ext}`; };
function dl(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
function saveSVG() { select(null); dl(URL.createObjectURL(new Blob([exportSVG()], {type: 'image/svg+xml'})), fname('svg')); }
function savePNG() {
  select(null);
  const W = +cv.getAttribute('width'), H = +cv.getAttribute('height'), k = 2, url = URL.createObjectURL(new Blob([exportSVG()], {type: 'image/svg+xml'})), im = new Image();
  im.onload = () => { const c = document.createElement('canvas'); c.width = W * k; c.height = H * k; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => dl(URL.createObjectURL(b), fname('png')), 'image/png'); };
  im.src = url;
}

/* ================= 단축키 ================= */
document.addEventListener('keydown', e => {
  if (txtAt || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'd') { e.preventDefault(); dupSel(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); delSel(); return; }
  if (e.key === 'Escape') { pvClose(); return; }
  if (ST.sel && e.key.startsWith('Arrow')) { e.preventDefault(); const s = e.shiftKey ? 10 : 1, g = ST.sel; g.dataset.tx = +g.dataset.tx + (k === 'arrowleft' ? -s : k === 'arrowright' ? s : 0); g.dataset.ty = +g.dataset.ty + (k === 'arrowup' ? -s : k === 'arrowdown' ? s : 0); place(g); select(g); commit(); return; }
  const m = {v: 'sel', p: 'pen', l: 'line', a: 'arrow', r: 'rect', o: 'ellipse', t: 'text'}[k];
  if (m && !e.ctrlKey && !e.metaKey) setTool(m);
});

/* 시작 */
drawGrid();
try { const s = localStorage.getItem(HK); if (s) restore(s); } catch (e) {}
commit();
if (window.lucide) lucide.createIcons();
